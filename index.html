<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorasaki Hina Speech Translator</title>
    <style>
        /* Gehenna Academy & Hina Theme */
        :root {
            --bg-color: #121214;
            --container-bg: #1e1e24;
            --accent-red: #c92a2a;
            --accent-red-hover: #e03131;
            --accent-gold: #fcc419;
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --border-color: #343a40;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        header {
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 11px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            display: block;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #121214;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .api-key-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background-color: var(--accent-red-hover);
        }

        .btn-secondary {
            background-color: #495057;
        }

        .btn-secondary:hover {
            background-color: #868e96;
        }

        .output-box {
            background-color: #121214;
            border: 1px dashed var(--border-color);
            border-radius: 4px;
            padding: 15px;
            min-height: 60px;
            font-style: italic;
            color: var(--text-muted);
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }

        .output-active {
            font-style: normal;
            color: var(--text-main);
            border-style: solid;
            border-color: var(--accent-gold);
        }

        .warning-text {
            font-size: 11px;
            color: #ffa94d;
            margin-top: 6px;
            line-height: 1.3;
        }

        .loading-indicator {
            display: none;
            color: var(--accent-gold);
            font-size: 13px;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Hina Speech Translator</h1>
            <span class="subtitle">Gehenna Academy Prefect Team</span>
        </header>

        <!-- API Key Storage Section -->
        <div class="section">
            <label for="apiKey">Google AI Studio API Key</label>
            <div class="api-key-container">
                <input type="password" id="apiKey" placeholder="AIzaSy...">
                <button type="button" class="btn btn-secondary" id="saveKeyBtn">Save</button>
            </div>
            <p class="warning-text">Your API key is saved locally in your browser's local storage and is never sent to external servers other than the Google Gemini API endpoint.</p>
        </div>

        <!-- Input Text Section -->
        <div class="section">
            <label for="inputText">Enter Text to Translate</label>
            <textarea id="inputText" placeholder="Type something you want Hina to say to a stranger..."></textarea>
        </div>

        <!-- Submit Button -->
        <div class="section" style="margin-bottom: 10px;">
            <button type="button" class="btn" style="width: 100%;" id="translateBtn">Translate</button>
            <div class="loading-indicator" id="loadingText">Contacting Head Prefect...</div>
        </div>

        <!-- Output Section -->
        <div class="section">
            <label>Translation Output</label>
            <div class="output-box" id="outputText">The translated response will appear here...</div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const inputText = document.getElementById('inputText');
        const translateBtn = document.getElementById('translateBtn');
        const outputText = document.getElementById('outputText');
        const loadingText = document.getElementById('loadingText');

        // Retrieve the stored API key when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        });

        // Store or clear the API key in Local Storage
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key saved locally. It is now safe to run on GitHub Pages.');
            } else {
                localStorage.removeItem('gemini_api_key');
                alert('API Key cleared.');
            }
        });

        // Translate function utilizing the Gemini REST Endpoint
        translateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const textToTranslate = inputText.value.trim();

            if (!apiKey) {
                alert('Please enter and save a valid Google AI Studio API key first.');
                return;
            }
            if (!textToTranslate) {
                alert('Please enter a sentence to translate.');
                return;
            }

            // Set loading interface state
            loadingText.style.display = 'block';
            translateBtn.disabled = true;
            outputText.textContent = 'Processing request...';
            outputText.classList.remove('output-active');

            try {
                // Configured to target the newer gemini-3.5-flash model
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    {
                                        text: `Translate this text: "${textToTranslate}"`
                                    }
                                ]
                            }
                        ],
                        systemInstruction: {
                            parts: [
                                {
                                    text: "You are Sorasaki Hina, the Head Prefect of the Gehenna Prefect Team from the game Blue Archive. Your task is to translate whatever the user inputs into how you would say it directly to a complete stranger. Maintain your strict stranger persona: \n1. Speak in an extremely calm, serious, composed, and professional manner.\n2. Be direct, concise, and business-like. Avoid fluff or casual explanations.\n3. Remain polite but cold and emotionally distant. Do not use exclamation marks, emojis, or friendly conversational words.\n4. You sound slightly tired and busy, but you maintain your absolute duty and boundaries.\n5. Output only the translated phrase directly. Do not include conversational prefaces, quotation marks, or meta-commentary."
                                }
                            ]
                        }
                    })
                });

                if (!response.ok) {
                    const errorDetails = await response.json();
                    throw new Error(errorDetails.error?.message || `HTTP status ${response.status}`);
                }

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (resultText) {
                    outputText.textContent = resultText.trim();
                    outputText.classList.add('output-active');
                } else {
                    throw new Error('No translation text was returned from the model.');
                }

            } catch (error) {
                console.error(error);
                outputText.textContent = `Error: ${error.message}`;
            } finally {
                loadingText.style.display = 'none';
                translateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
