<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorasaki Hina & Nahida Speech Translator</title>
    <style>
        /* Base / CSS Variable Themes */
        :root {
            /* Default: Gehenna Academy & Hina Theme */
            --bg-color: #121214;
            --container-bg: #1e1e24;
            --accent-color: #c92a2a;
            --accent-hover: #e03131;
            --accent-highlight: #fcc419;
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --border-color: #343a40;
        }

        body.theme-nahida {
            /* Sumeru & Nahida Theme */
            --bg-color: #0f1612;
            --container-bg: #19241d;
            --accent-color: #2b8a3e;
            --accent-hover: #2f9e44;
            --accent-highlight: #a9e34b;
            --text-main: #f1f3f5;
            --text-muted: #8f9e8b;
            --border-color: #2b3a2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            transition: border-color 0.3s ease;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 11px;
            color: var(--accent-highlight);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            display: block;
            transition: color 0.3s ease;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        /* Character Profile Selector Styles */
        .char-tabs {
            display: flex;
            gap: 10px;
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .char-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .char-tab:focus {
            outline: none;
        }

        .char-tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, background-color 0.3s;
        }

        input[type="password"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .api-key-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #495057;
        }

        .btn-secondary:hover {
            background-color: #868e96;
        }

        .output-box {
            background-color: var(--bg-color);
            border: 1px dashed var(--border-color);
            border-radius: 4px;
            padding: 15px;
            min-height: 60px;
            font-style: italic;
            color: var(--text-muted);
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
            transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
        }

        .output-active {
            font-style: normal;
            color: var(--text-main);
            border-style: solid;
            border-color: var(--accent-highlight);
        }

        .warning-text {
            font-size: 11px;
            color: #ffa94d;
            margin-top: 6px;
            line-height: 1.3;
        }

        .loading-indicator {
            display: none;
            color: var(--accent-highlight);
            font-size: 13px;
            margin-top: 10px;
            font-weight: 600;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="headerTitle">Hina Speech Translator</h1>
            <span id="headerSubtitle" class="subtitle">Gehenna Academy Prefect Team</span>
        </header>

        <!-- API Key Storage Section -->
        <div class="section">
            <label for="apiKey">Google AI Studio API Key</label>
            <div class="api-key-container">
                <input type="password" id="apiKey" placeholder="AIzaSy...">
                <button type="button" class="btn btn-secondary" id="saveKeyBtn">Save</button>
            </div>
            <p class="warning-text">Your API key is saved locally in your browser's local storage and is never sent to external servers other than the Google Gemini API endpoint.</p>
        </div>

        <!-- Character Selector Section -->
        <div class="section">
            <label>Select Character Profile</label>
            <div class="char-tabs">
                <button type="button" class="char-tab active" data-char="hina">Sorasaki Hina</button>
                <button type="button" class="char-tab" data-char="nahida">Nahida</button>
                <!-- 
                     To add a new character in the future:
                     Simply add a button here with a custom data-char attribute:
                     e.g., <button type="button" class="char-tab" data-char="fischl">Fischl</button>
                -->
            </div>
        </div>

        <!-- Input Text Section -->
        <div class="section">
            <label id="inputLabel" for="inputText">Enter Text to Translate</label>
            <textarea id="inputText" placeholder="Type something you want Hina to say to a stranger..."></textarea>
        </div>

        <!-- Submit Button -->
        <div class="section" style="margin-bottom: 10px;">
            <button type="button" class="btn" style="width: 100%;" id="translateBtn">Translate</button>
            <div class="loading-indicator" id="loadingText">Searching sources & analyzing style...</div>
        </div>

        <!-- Output Section -->
        <div class="section">
            <label>Translation Output</label>
            <div class="output-box" id="outputText">The translated response will appear here...</div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const inputText = document.getElementById('inputText');
        const translateBtn = document.getElementById('translateBtn');
        const outputText = document.getElementById('outputText');
        const loadingText = document.getElementById('loadingText');
        const headerTitle = document.getElementById('headerTitle');
        const headerSubtitle = document.getElementById('headerSubtitle');
        const charTabs = document.querySelectorAll('.char-tab');

        // Character Configuration Map
        const CHARACTERS = {
            hina: {
                themeClass: '',
                title: 'Hina Speech Translator',
                subtitle: 'Gehenna Academy Prefect Team',
                placeholder: 'Type something you want Hina to say to a stranger...',
                loadingText: 'Querying Gehenna databases & studying speech...',
                characterName: 'Sorasaki Hina (from Blue Archive)',
                // Specify exactly two search websites for style extraction
                searchWebsites: [
                    'https://bluearchive.fandom.com/wiki/Sorasaki_Hina',
                    'https://bluearchive.wiki/wiki/Hina'
                ],
                systemInstruction: "You are a Style Transfer Translator. Your sole task is to take the user's input and translate/rephrase it exactly how Sorasaki Hina (the Head Prefect of the Gehenna Prefect Team from Blue Archive) would express that same exact statement to a complete stranger."
            },
            nahida: {
                themeClass: 'theme-nahida',
                title: 'Nahida Speech Translator',
                subtitle: 'Sumeru Sanctuary of Surasthana',
                placeholder: 'Type something you want Nahida to gently explain...',
                loadingText: 'Searching Irminsul & studying speech patterns...',
                characterName: 'Nahida (Lesser Lord Kusanali from Genshin Impact)',
                // Specify exactly two search websites for style extraction
                searchWebsites: [
                    'https://genshin-impact.fandom.com/wiki/Nahida',
                    'https://genshin-impact.fandom.com/wiki/Nahida/Voice-Overs'
                ],
                systemInstruction: "You are a Style Transfer Translator. Your sole task is to take the user's input and translate/rephrase it exactly how Nahida (Lesser Lord Kusanali from Genshin Impact) would express that same exact statement."
            }
            /* 
               TEMPLATE FOR ADDING A NEW CHARACTER IN THE FUTURE:
               
               ,your_char_key: {
                   themeClass: 'theme-yourclass', // optional custom theme class
                   title: 'Your Character Translator',
                   subtitle: 'Faction / Title Here',
                   placeholder: 'Enter text here...',
                   loadingText: 'Analyzing character speech profiles...',
                   characterName: 'Full Character Name (and Game of Origin)',
                   searchWebsites: [
                       'https://website1-containing-dialogue.com',
                       'https://website2-containing-voice-lines.com'
                   ],
                   systemInstruction: "You are a Style Transfer Translator. Your sole task is to take the user's input and translate/rephrase it exactly how [Character Name] would express that same exact statement."
               }
            */
        };

        let currentCharacter = 'hina';

        // Function to handle switching character assets, text, and styling
        function setCharacter(charKey) {
            currentCharacter = charKey;
            const config = CHARACTERS[charKey];

            // Toggle active status on selector buttons
            charTabs.forEach(tab => {
                if (tab.dataset.char === charKey) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // Switch theme class on body element
            document.body.className = config.themeClass;

            // Apply specific text content updates
            headerTitle.textContent = config.title;
            headerSubtitle.textContent = config.subtitle;
            inputText.placeholder = config.placeholder;
            loadingText.textContent = config.loadingText;

            // Save choice in localStorage
            localStorage.setItem('selected_character', charKey);

            // Re-render placeholder if no text has been entered or produced yet
            if (!outputText.classList.contains('output-active')) {
                outputText.textContent = 'The translated response will appear here...';
            }
        }

        // Add Click Listener to Profile Buttons
        charTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                setCharacter(tab.dataset.char);
            });
        });

        // Retrieve the stored API key & character profile when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }

            const savedChar = localStorage.getItem('selected_character');
            if (savedChar && CHARACTERS[savedChar]) {
                setCharacter(savedChar);
            } else {
                setCharacter('hina');
            }
        });

        // Store or clear the API key in Local Storage
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key saved locally. It is now safe to run on GitHub Pages.');
            } else {
                localStorage.removeItem('gemini_api_key');
                alert('API Key cleared.');
            }
        });

        // Translate function utilizing the Gemini REST Endpoint
        translateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const textToTranslate = inputText.value.trim();

            if (!apiKey) {
                alert('Please enter and save a valid Google AI Studio API key first.');
                return;
            }
            if (!textToTranslate) {
                alert('Please enter a sentence to translate.');
                return;
            }

            // Set loading interface state
            loadingText.style.display = 'block';
            translateBtn.disabled = true;
            outputText.textContent = 'Searching web databases and executing style transfer...';
            outputText.classList.remove('output-active');

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
                const currentConfig = CHARACTERS[currentCharacter];

                // Dynamically build the search-grounded instructions telling Gemini exactly which websites to scrape and analyze
                let finalSystemInstruction = currentConfig.systemInstruction;
                if (currentConfig.searchWebsites && currentConfig.searchWebsites.length >= 2) {
                    finalSystemInstruction += `\n\nCRITICAL DIRECTIVE:\n` +
                        `1. You MUST use your active Google Search tool before processing this request.\n` +
                        `2. Specifically look up, read, and analyze the content on these two exact websites to study this character's exact personality, direct in-game quotes, speech rhythm, phrasing structure, and vocabulary:\n` +
                        `   - ${currentConfig.searchWebsites[0]}\n` +
                        `   - ${currentConfig.searchWebsites[1]}\n\n` +
                        `3. Do NOT translate based on general guesses. Adopt the precise dialect and stylistic habits discovered from your search on these specific sites.\n` +
                        `4. Do NOT reply to the user's input as a chatbot. Do NOT answer questions. Simply restate the statement itself in the character's exact voice.\n` +
                        `5. Output ONLY the translated phrase directly. Do not include conversational prefaces, intro commentary, quotation marks, or notes.`;
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    {
                                        text: `Translate this text into ${currentConfig.characterName}'s exact speaking style: "${textToTranslate}"`
                                    }
                                ]
                            }
                        ],
                        systemInstruction: {
                            parts: [
                                {
                                    text: finalSystemInstruction
                                }
                            ]
                        },
                        // Enable real-time Google Search Grounding natively
                        tools: [
                            {
                                googleSearch: {}
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    const errorDetails = await response.json();
                    throw new Error(errorDetails.error?.message || `HTTP status ${response.status}`);
                }

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (resultText) {
                    outputText.textContent = resultText.trim();
                    outputText.classList.add('output-active');
                } else {
                    throw new Error('No translation text was returned from the model.');
                }

            } catch (error) {
                console.error(error);
                outputText.textContent = `Error: ${error.message}`;
            } finally {
                loadingText.style.display = 'none';
                translateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
